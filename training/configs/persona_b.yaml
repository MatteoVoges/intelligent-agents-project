# Persona B — friendly, casual explainer with analogies.
base_model: Qwen/Qwen2.5-7B-Instruct
dataset_path: training/data/persona_b.jsonl
output_dir: adapters/persona-b

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  # See persona_a.yaml — 3 epochs is too few steps at this dataset size to imprint the format.
  epochs: 10
  batch_size: 2
  grad_accum: 4
  lr: 2.0e-4
  max_seq_len: 1024
